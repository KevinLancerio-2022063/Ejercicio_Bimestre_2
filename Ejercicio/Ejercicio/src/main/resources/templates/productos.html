<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/Base.css}">

    <title>Productos</title>
</head>
<body>

<div class="navbar">
    <h2>Gestión de Productos</h2>
</div>

<input type="checkbox" id="togglePanel">

<div class="panel-lista">

    <div class="panel-header">
        <h3>Productos</h3>
        <label for="togglePanel" class="cerrar-btn">X</label>
    </div>

    <div class="search-box">
        <input type="text" id="buscar" placeholder="Buscar producto..." onkeyup="filtrarTabla()">
    </div>

    <br>

    <table id="tablaProductos">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.codigo_producto}"></td>
            <td th:text="${p.nombre_producto}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.stock}"></td>
            <td th:text="${p.estado}"></td>
            <td>

                <a th:if="${session.rol == 'ADMIN'}"
                   th:href="@{'/productos/editar/' + ${p.codigo_producto}}">
                    <button class="btn-edit">Editar</button>
                </a>

                <a th:if="${session.rol == 'ADMIN'}"
                   th:href="@{'/productos/eliminar/' + ${p.codigo_producto}}">
                    <button class="btn-delete">Eliminar</button>
                </a>

            </td>
        </tr>
        </tbody>
    </table>

</div>

<div class="container">
    <div class="form-card">

        <h2 th:text="${producto.codigo_producto != null} ? 'Editar Producto' : 'Registrar Producto'"></h2>

        <div class="imagen">
            <img th:src="@{/images/AgregarProducto.png}" alt="Imagen de un producto siendo agregado" width="150" height="150">
        </div>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

            <input type="hidden" th:field="*{codigo_producto}" />

            <div class="form-grid">

                <input type="text" th:field="*{nombre_producto}" placeholder="Nombre del producto">
                <input type="number" step="0.01" th:field="*{precio}" placeholder="Precio">
                <input type="number" th:field="*{stock}" placeholder="Stock">
                <input type="number" th:field="*{estado}" placeholder="Estado (0 o 1)">

            </div>

            <div class="botones">

                <label for="togglePanel" class="listar">
                    Listar
                </label>

                <button type="submit"
                        th:if="${session.rol == 'ADMIN'}"
                        th:text="${producto.codigo_producto != null} ? 'Actualizar' : 'Guardar'">
                </button>

                <button type="button" onclick="location.href='/menu'" class="volver">
                    Volver
                </button>

            </div>

        </form>

    </div>
</div>

</body>

<script th:src="@{/Scripts/scriptProducto.js}"></script>

</html>
